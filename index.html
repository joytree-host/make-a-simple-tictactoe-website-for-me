<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        
        <div class="score-board">
            <div class="score">
                <span class="score-label">Player X</span>
                <span class="score-value" id="scoreX">0</span>
            </div>
            <div class="score">
                <span class="score-label">Player O</span>
                <span class="score-value" id="scoreO">0</span>
            </div>
            <div class="score">
                <span class="score-label">Draws</span>
                <span class="score-value" id="scoreDraw">0</span>
            </div>
        </div>

        <div class="turn-indicator" id="turnIndicator">
            Current turn: <span id=" currentPlayer">X</span>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- Cells will be generated by JavaScript -->
        </div>

        <div class="controls">
            <button id="resetBtn" class="btn">Reset Game</button>
            <button id="resetScoreBtn" class="btn btn-secondary">Reset Scores</button>
        </div>

        <div class="rules">
            <h3>How to Play</h3>
            <p>Get three of your marks in a row (horizontally, vertically, or diagonally) to win!</p>
            <p>Player X goes first. Take turns placing your marks on the 3x3 grid.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
